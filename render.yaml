# Render Blueprint — Orwell SEO Command Centre
# Deploy: push this repo, then in Render → "New +" → "Blueprint" and point at it.
# Docs: https://render.com/docs/blueprint-spec
#
# What this provisions:
#   1. orwell-db   — managed PostgreSQL (holds live snapshots once providers connect)
#   2. orwell-web  — the Next.js web service (the dashboard itself)
#   3. orwell-jobs — a scheduled cron worker for daily/weekly SEO sync jobs
#
# Secrets (DataForSEO / Google / auth) are declared with `sync: false` so their
# VALUES are entered in the Render dashboard, never committed to git.

databases:
  # IMPORTANT: the database MUST be in the same region as the services, otherwise
  # the internal `dpg-…` hostname will not resolve and pre-deploy migrations (and
  # runtime DB access) fail with ENOTFOUND. This DB is pinned to `frankfurt` to
  # match orwell-web / orwell-jobs. The resource is named `orwell-db-fra` (rather
  # than changing an existing DB's region, which Render cannot do in place) so a
  # fresh Frankfurt database is created cleanly; delete the old Oregon `orwell-db`.
  - name: orwell-db-fra
    databaseName: orwell
    user: orwell
    region: frankfurt
    plan: basic-256mb # upgrade as data volume grows
    postgresMajorVersion: "16"

services:
  # ------------------------------------------------------------------ web ---
  - type: web
    name: orwell-web
    runtime: node
    plan: starter
    region: frankfurt # closest to UAE/EU pilot markets; change if desired
    branch: claude/seo-dashboard-dataforseo-112fbm
    buildCommand: npm ci && npm run build
    # Apply DB migrations before each deploy goes live (idempotent).
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      - key: PORT
        value: "10000"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Bearer token for the manual POST /api/sync trigger. Set a long random
      # value in the dashboard; the route refuses all requests while unset.
      - key: SYNC_TOKEN
        sync: false
      - key: MONTHLY_BUDGET_USD
        value: "200"
      - key: DATABASE_URL
        fromDatabase:
          name: orwell-db-fra
          property: connectionString
      # --- Secrets: set values in the Render dashboard (never in git) ---
      - key: AUTH_SECRET
        generateValue: true
      # Internal access account. For multiple users, set AUTH_USERS_JSON instead
      # (see .env.example) and leave these two unset.
      - key: AUTH_EMAIL
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_USERS_JSON
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: DATAFORSEO_BASE_URL
        value: https://api.dataforseo.com
      - key: AI_COPILOT_WEBHOOK_URL
        sync: false
      - key: AI_COPILOT_WEBHOOK_SECRET
        sync: false
      - key: OUTREACH_EMAIL_WEBHOOK_URL
        sync: false
      - key: OUTREACH_WEBHOOK_SECRET
        sync: false
      - key: DATAFORSEO_LOCATION_BUSRENTALGLOBAL
        sync: false
      - key: DATAFORSEO_LOCATION_PETTRANSPORTGLOBAL
        sync: false
      - key: DATAFORSEO_LANGUAGE_BUSRENTALGLOBAL
        value: en
      - key: DATAFORSEO_LANGUAGE_PETTRANSPORTGLOBAL
        value: en
      # --- Google (GSC + GA4): pick ONE auth method, values set in dashboard ---
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GA4_PROPERTY_BUSRENTALGLOBAL
        sync: false
      - key: GA4_PROPERTY_MORTGAGECOMPARE
        sync: false
      - key: GA4_PROPERTY_PETTRANSPORTGLOBAL
        sync: false
      - key: GA4_PROPERTY_MONEYCOMPARE
        sync: false
      - key: GA4_PROPERTY_INSURECOMPARE
        sync: false
      - key: GA4_PROPERTY_PESTREMOVALUSA
        sync: false
      - key: GA4_PROPERTY_CLOSEPROTECTIONHIRE
        sync: false
      - key: GA4_PROPERTY_CHECKMYENERGYCLAIM
        sync: false
      - key: GA4_PROPERTY_ENERGYCLAIMHELPLINEUK
        sync: false
      - key: GA4_PROPERTY_ENERGYCLAIMHELPLINECOM
        sync: false
      - key: GA4_PROPERTY_MYENERGYCLAIM
        sync: false
      - key: GA4_PROPERTY_WARMHOMESCHEMELOAN
        sync: false

  # --------------------------------------------------------------- worker ---
  # Split-cadence live sync plus due report delivery handoffs.
  - type: cron
    name: orwell-jobs
    runtime: node
    plan: starter
    region: frankfurt
    branch: claude/seo-dashboard-dataforseo-112fbm
    schedule: "0 6 * * *" # 06:00 UTC daily
    buildCommand: npm ci && npm run build
    startCommand: npm run jobs
    envVars:
      - key: NODE_VERSION
        value: "22.22.2"
      - key: CRON_ENABLED
        value: "true"
      # Split-cadence cost policy (see scripts/jobs.ts): Google free daily,
      # DataForSEO light weekly (Mondays), due AI prompts daily, crawls monthly
      # (1st). DFS overrides force a tier ON when set to "1"; SYNC_GOOGLE=0,
      # SYNC_RANKINGS=0 and SYNC_AI=0 disable their daily tier.
      - key: SYNC_DFS_LIGHT
        sync: false
      - key: SYNC_DFS_HEAVY
        sync: false
      - key: SYNC_RANKINGS
        sync: false
      - key: SYNC_AI
        sync: false
      - key: SYNC_CONCURRENCY
        value: "2"
      - key: ONBOARDING_JOBS_PER_RUN
        value: "5"
      - key: MONTHLY_BUDGET_USD
        value: "200"
      - key: DATABASE_URL
        fromDatabase:
          name: orwell-db-fra
          property: connectionString
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: DATAFORSEO_BASE_URL
        value: https://api.dataforseo.com
      - key: AI_COPILOT_WEBHOOK_URL
        sync: false
      - key: AI_COPILOT_WEBHOOK_SECRET
        sync: false
      - key: DATAFORSEO_LOCATION_BUSRENTALGLOBAL
        sync: false
      - key: DATAFORSEO_LOCATION_PETTRANSPORTGLOBAL
        sync: false
      - key: DATAFORSEO_LANGUAGE_BUSRENTALGLOBAL
        value: en
      - key: DATAFORSEO_LANGUAGE_PETTRANSPORTGLOBAL
        value: en
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: GA4_PROPERTY_BUSRENTALGLOBAL
        sync: false
      - key: GA4_PROPERTY_MORTGAGECOMPARE
        sync: false
      - key: GA4_PROPERTY_PETTRANSPORTGLOBAL
        sync: false
      - key: GA4_PROPERTY_MONEYCOMPARE
        sync: false
      - key: GA4_PROPERTY_INSURECOMPARE
        sync: false
      - key: GA4_PROPERTY_PESTREMOVALUSA
        sync: false
      - key: GA4_PROPERTY_CLOSEPROTECTIONHIRE
        sync: false
      - key: GA4_PROPERTY_CHECKMYENERGYCLAIM
        sync: false
      - key: GA4_PROPERTY_ENERGYCLAIMHELPLINEUK
        sync: false
      - key: GA4_PROPERTY_ENERGYCLAIMHELPLINECOM
        sync: false
      - key: GA4_PROPERTY_MYENERGYCLAIM
        sync: false
      - key: GA4_PROPERTY_WARMHOMESCHEMELOAN
        sync: false
      - key: REPORT_DELIVERY_WEBHOOK_URL
        sync: false
      - key: REPORT_WEBHOOK_SECRET
        sync: false
      - key: ALERT_EMAIL_WEBHOOK_URL
        sync: false
      - key: ALERT_WHATSAPP_WEBHOOK_URL
        sync: false
      - key: ALERT_WEBHOOK_SECRET
        sync: false

  # ---------------------------------------------------------- operations ---
  # Playwright-backed hybrid crawl queue, public uptime/TLS checks and bounded
  # Local SEO grid monitoring. A separate cron keeps browser dependencies out
  # of the web service and costs only for scheduled runtime.
  - type: cron
    name: orwell-operations
    runtime: docker
    plan: starter
    region: frankfurt
    branch: claude/seo-dashboard-dataforseo-112fbm
    schedule: "0 * * * *" # hourly, UTC
    dockerfilePath: ./Dockerfile.operations
    dockerContext: .
    dockerCommand: npm run jobs:operations
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orwell-db-fra
          property: connectionString
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /ms-playwright
      - key: BROWSER_CRAWL_MAX_PAGES
        value: "200"
      - key: BROWSER_CRAWL_JOBS_PER_RUN
        value: "1"
      - key: AUTO_BROWSER_CRAWLS
        value: "1"
      - key: RELIABILITY_CONCURRENCY
        value: "8"
      - key: LOCAL_SEO_LOCATIONS_PER_RUN
        value: "2"
      - key: MONTHLY_BUDGET_USD
        value: "200"
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: DATAFORSEO_BASE_URL
        value: https://api.dataforseo.com
